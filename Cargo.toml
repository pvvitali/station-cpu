[package]
name = "station-cpu"
version = "0.1.0"
edition = "2024"

[dependencies]
# Базовые библиотеки ARM
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"

# Система логирования
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# Экосистема Embassy (обновленные фичи)
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f412rg", "memory-x", "time-driver-any", "exti", "defmt", "unstable-pac"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] } # <-- ДОБАВЛЕНО для Channel и Mutex

# --- НОВЫЕ ЗАВИСИМОСТИ ---

# Графика и дисплей
embedded-graphics = "0.8.1"
display-interface = "0.4.1"     # <-- ИЗМЕНИЛИ С 0.5.0 на 0.4.1
display-interface-spi = "0.4.1" # <-- ИЗМЕНИЛИ С 0.5.0 на 0.4.1
ssd1309 = "0.4.0"

# Структуры данных без динамической памяти (no_std)
heapless = "0.9.3"

micromath = "2.1"
