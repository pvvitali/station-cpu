[package]
name = "station-cpu"
version = "0.1.0"
edition = "2024"

[features]
default = ["hw-v2"] # По умолчанию собираем под новую плату
hw-v1 = []          # Старая плата (контроль по PG, пульсации OTG)
hw-v2 = []          # Новая плата (IS_12V на PC14 + ENABLE_PMID на PC3)

[dependencies]
# Базовые библиотеки ARM
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"

# Система логирования
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
panic-reset = "0.1.1"

# Экосистема Embassy (обновленные фичи)
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f412rg", "time-driver-any", "exti", "defmt", "unstable-pac"] }
#  "memory-x", 
embassy-sync = { version = "0.8.0", features = ["defmt"] } # <-- ДОБАВЛЕНО для Channel и Mutex
embassy-futures = "0.1"
embassy-boot-stm32 = { version = "0.8.0", features = ["defmt"] }
embedded-storage = "0.3"

# --- НОВЫЕ ЗАВИСИМОСТИ ---

# Графика и дисплей
embedded-graphics = "0.8.1"
display-interface = "0.4.1"     # <-- ИЗМЕНИЛИ С 0.5.0 на 0.4.1
display-interface-spi = "0.4.1" # <-- ИЗМЕНИЛИ С 0.5.0 на 0.4.1
ssd1309 = "0.4.0"

# Структуры данных без динамической памяти (no_std)
heapless = { version = "0.9.3", features = ["defmt"] }

micromath = "2.1"
embedded-io-async = { version = "0.7.0", default-features = false }

# Оптимизируем все сторонние библиотеки даже в режиме Debug
#[profile.dev.package."*"]
#opt-level = "s"

# Оптимизируем ядро языка (core/alloc)
#[profile.dev.build-override]
#opt-level = "s"

#[profile.release]
#opt-level = "s"       # Оптимизация по размеру ("z" для еще более агрессивного сжатия, 3 - для максимальной скорости)
#lto = true            # Link Time Optimization: компилятор анализирует весь код целиком и вырезает всё неиспользуемое
#codegen-units = 1     # Замедляет компиляцию, но дает компилятору возможность лучше оптимизировать код
#debug = false         # Отключает генерацию отладочных символов
#strip = false         # Вырезает символы и отладочную информацию из итогового бинарника
#panic = "abort"       # Мгновенная остановка при панике (экономит память, убирая код "раскрутки" стека)

[profile.release]
debug = 2         # Оставляет символы для defmt/RTT (НЕ увеличивает размер прошивки во флеше МК!)
opt-level = "s"   # Оптимизация по размеру (можно "z" для минимального размера)
lto = true        # Оптимизация на этапе линковки
#lto = "thin"

#cargo build --release
#probe-rs run --chip STM32F412RG target\thumbv7em-none-eabihf\release\station-cpu
#cargo run --release